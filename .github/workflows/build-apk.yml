name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/mobile-app-from-markdown-p0uxzh
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - name: flutter create (scaffold android/ platform folder)
        run: flutter create --platforms=android . --org com.ilocation --project-name ilocation

      - name: add INTERNET permission (missing from the default template)
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>|' android/app/src/main/AndroidManifest.xml
          grep 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: add ACTION_VIEW query (needed for url_launcher to open https links on Android 11+)
        run: |
          grep -q 'android.intent.action.VIEW' android/app/src/main/AndroidManifest.xml || \
          sed -i 's|    </queries>|        <intent>\n            <action android:name="android.intent.action.VIEW"/>\n            <data android:scheme="https"/>\n        </intent>\n    </queries>|' android/app/src/main/AndroidManifest.xml
          grep 'android.intent.action.VIEW' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ilocation-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
