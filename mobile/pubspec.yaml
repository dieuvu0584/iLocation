name: ilocation
description: "Location Info Explorer — node-graph travel info app."
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  url_launcher: ^6.3.1
  firebase_core: ^3.6.0
  firebase_remote_config: ^5.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/emergency_numbers.json

# App launcher icon (đợt 12, CLAUDE.md) — a location pin in the app's
# palette (see lib/theme/colors.dart). `android/` isn't committed to the
# repo (regenerated by CI each build), so this only takes effect once CI
# runs `dart run flutter_launcher_icons` after `flutter create` — see
# .github/workflows/build-apk.yml. Source images: tool/generate_icon.py.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#16283A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
